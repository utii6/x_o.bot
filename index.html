<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XO 🎮</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
</head>

<body>

  <h1>XO 🎮</h1>

  <div id="status">جاري تحميل اللعبة...</div>

  <div id="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <div id="actions">
    <button id="shareBtn" type="button">👥 العب مع صاحبـك</button>
    <button id="aiBtn" type="button">🤖 ضد البوت</button>
  </div>

  <div id="reactions">
    <button type="button" onclick="sendEmoji('😂')">😂</button>
    <button type="button" onclick="sendEmoji('😏')">😏</button>
    <button type="button" onclick="sendEmoji('🔥')">🔥</button>
    <button type="button" onclick="sendEmoji('😱')">😱</button>
    <button type="button" onclick="sendEmoji('💀')">💀</button>
  </div>

  <audio id="bgMusic" autoplay loop>
    <source src="boss2014.mp3" type="audio/mpeg">
  </audio>

  <script src="game.js"></script>

</body>
</html>
