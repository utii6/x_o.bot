<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة XO</title>
    <!-- مكتبة تليجرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- مكتبة الاحتفالات (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    
    <!-- استدعاء ملف تنسيقاتك الخارجي -->
    <link rel="stylesheet" href="style.css">

    <style>
        /* التنسيق الأساسي لفيديو وخلفية الصوت فقط */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }
    </style>
</head>
<body>

    <!-- تشغيل فيديو الخلفية -->
    <video id="bgVideo" autoplay loop muted playsinline>
        <source src="FullHD.MP4" type="video/mp4">
    </video>

    <!-- تشغيل الموسيقى المحلية -->
    <audio id="bgMusic" src="boss2014.mp3" loop autoplay></audio>

    <h2>🎮 لعبة XO </h2>
    <div id="status" class="status">جاري التحميل...</div>

    <div style="margin-bottom: 15px;">
        <button id="shareBtn" class="btn btn-share" onclick="shareGame()">🔗 دعوة صاحبـك</button>
        <button id="aiBtn" class="btn btn-ai" onclick="startAiMode()">🤖 اللعب ضد الفارغين</button>
    </div>

    <div class="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
    </div>

    <div class="emojis">
        <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
        <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
        <button class="emoji-btn" onclick="sendEmoji('😎')">😎</button>
        <button class="emoji-btn" onclick="sendEmoji('👏')">👏</button>
    </div>

    <!-- استدعاء ملف الـ JS المستقل -->
    <script src="script.js"></script>
</body>
</html>
