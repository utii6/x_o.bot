<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة XO </title>
    <!-- مكتبة تليجرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- مكتبة الاحتفالات (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 20px; }
        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 20px auto; }
        .cell { width: 90px; height: 90px; background: #1e1e1e; border: 2px solid #333; font-size: 2.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; }
        .btn { padding: 10px 15px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin: 5px; color: #fff; }
        .btn-share { background: #0088cc; }
        .btn-ai { background: #6c757d; }
        .status { font-size: 1.2rem; margin-bottom: 15px; }
        .emojis { margin-top: 15px; }
        .emoji-btn { font-size: 1.5rem; background: none; border: none; cursor: pointer; }
        .floating-emoji { position: fixed; bottom: 20%; left: 50%; transform: translateX(-50%); font-size: 3rem; animation: floatUp 1.5s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -100px); } }
    </style>
</head>
<body>

    <h2>🎮 لعبة XO التفاعلية</h2>
    <div id="status" class="status">جاري التحميل...</div>

    <div style="margin-bottom: 15px;">
        <button id="shareBtn" class="btn btn-share" onclick="shareGame()">🔗 دعوة صاحبـك</button>
        <button id="aiBtn" class="btn btn-ai" onclick="startAiMode()">🤖 اللعب ضد الفارغين</button>
    </div>

    <div class="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
    </div>

    <div class="emojis">
        <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
        <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
        <button class="emoji-btn" onclick="sendEmoji('😎')">😎</button>
        <button class="emoji-btn" onclick="sendEmoji('👏')">👏</button>
    </div>

    <!-- استدعاء ملف الـ JS المستقل -->
    <script src="script.js"></script>
</body>
</html>
