<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>X O لعبة</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Confetti Effects -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    #status { font-size: 1.2rem; margin: 15px 0; color: #0088cc; font-weight: bold; }
    .btn-share { padding: 10px 20px; background: #2481cc; color: white; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin-bottom: 15px; display: none; }
    .reactions { display: flex; gap: 10px; justify-content: center; margin-top: 15px; }
    .reactions button { font-size: 1.5rem; background: #2a2a2a; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
    .floating-emoji { position: fixed; bottom: 30%; left: 50%; font-size: 4rem; animation: popup 1.5s ease-out forwards; pointer-events: none; }
    @keyframes popup { 0% { opacity: 0; transform: translate(-50%, 20px) scale(0.5); } 50% { opacity: 1; transform: translate(-50%, -40px) scale(1.2); } 100% { opacity: 0; transform: translate(-50%, -80px) scale(1); } }
  </style>
</head>
<body>
  <h1>X O لعبة 🎮</h1>

  <div id="status">جاري تحضير اللعبة...</div>

  <button id="shareBtn" class="btn-share" onclick="shareGame()">👥 دعوة صديق للعب</button>

  <div id="board">
    <div class="cell" data-index="0" onclick="makeMove(0)"></div>
    <div class="cell" data-index="1" onclick="makeMove(1)"></div>
    <div class="cell" data-index="2" onclick="makeMove(2)"></div>
    <div class="cell" data-index="3" onclick="makeMove(3)"></div>
    <div class="cell" data-index="4" onclick="makeMove(4)"></div>
    <div class="cell" data-index="5" onclick="makeMove(5)"></div>
    <div class="cell" data-index="6" onclick="makeMove(6)"></div>
    <div class="cell" data-index="7" onclick="makeMove(7)"></div>
    <div class="cell" data-index="8" onclick="makeMove(8)"></div>
  </div>

  <div class="reactions">
    <button onclick="sendEmoji('🔥')">🔥</button>
    <button onclick="sendEmoji('😂')">😂</button>
    <button onclick="sendEmoji('👀')">👀</button>
    <button onclick="sendEmoji('👏')">👏</button>
  </div>

  <!-- موسيقى الخلفية الأصليّة -->
  <audio id="bgMusic" autoplay loop>
    <source src="boss2014.mp3" type="audio/mpeg" />
    <source src="boss2014.mp3" type="audio/mp4" />
  </audio>

  <script src="game.js"></script>
</body>
</html>
