<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة XO</title>
    <!-- مكتبة تليجرام -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- مكتبة Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- مكتبة الاحتفالات (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        /* فيديو الخلفية لتغطية الشاشة بالكامل */
        #bgVideo {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: -1;
        }

        /* طبقة حماية شفافة لتوضيح العناصر فوق الفيديو */
        body {
            font-family: sans-serif;
            text-align: center;
            color: #fff;
            margin: 0;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            min-height: 100vh;
            box-sizing: border-box;
        }

        .board { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 300px; margin: 20px auto; }
        .cell { width: 90px; height: 90px; background: rgba(30, 30, 30, 0.75); border: 2px solid rgba(255, 255, 255, 0.2); font-size: 2.5rem; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 10px; backdrop-filter: blur(4px); }
        .btn { padding: 10px 15px; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; margin: 5px; color: #fff; }
        .btn-share { background: #0088cc; }
        .btn-ai { background: #6c757d; }
        .status { font-size: 1.2rem; margin-bottom: 15px; text-shadow: 0 2px 4px rgba(0,0,0,0.8); }
        .emojis { margin-top: 15px; }
        .emoji-btn { font-size: 1.5rem; background: none; border: none; cursor: pointer; }
        .floating-emoji { position: fixed; bottom: 20%; left: 50%; transform: translateX(-50%); font-size: 3rem; animation: floatUp 1.5s ease-out forwards; }
        @keyframes floatUp { 0% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -100px); } }
    </style>
</head>
<body>

    <!-- تشغيل فيديو الخلفية -->
    <video id="bgVideo" autoplay loop muted playsinline>
        <source src="FullHD.MP4" type="video/mp4">
    </video>

    <!-- تشغيل الصوت المحلي -->
    <audio id="bgMusic" src="boss2014.mp3" loop autoplay></audio>

    <h2>🎮 لعبة XO </h2>
    <div id="status" class="status">جاري التحميل...</div>

    <div style="margin-bottom: 15px;">
        <button id="shareBtn" class="btn btn-share" onclick="shareGame()">🔗 دعوة صاحبـك</button>
        <button id="aiBtn" class="btn btn-ai" onclick="startAiMode()">🤖 اللعب ضد الفارغين</button>
    </div>

    <div class="board">
        <div class="cell" onclick="makeMove(0)"></div>
        <div class="cell" onclick="makeMove(1)"></div>
        <div class="cell" onclick="makeMove(2)"></div>
        <div class="cell" onclick="makeMove(3)"></div>
        <div class="cell" onclick="makeMove(4)"></div>
        <div class="cell" onclick="makeMove(5)"></div>
        <div class="cell" onclick="makeMove(6)"></div>
        <div class="cell" onclick="makeMove(7)"></div>
        <div class="cell" onclick="makeMove(8)"></div>
    </div>

    <div class="emojis">
        <button class="emoji-btn" onclick="sendEmoji('🔥')">🔥</button>
        <button class="emoji-btn" onclick="sendEmoji('😂')">😂</button>
        <button class="emoji-btn" onclick="sendEmoji('😎')">😎</button>
        <button class="emoji-btn" onclick="sendEmoji('👏')">👏</button>
    </div>

    <!-- استدعاء ملف الـ JS المستقل -->
    <script src="script.js"></script>
</body>
</html>
